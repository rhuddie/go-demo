on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on:
        - ubuntu-latest
    env:
      DOCKER_COMPOSE_FILE: docker-compose.yml
      PORT: "8081"
    steps:
    - name: checkout
      uses: actions/checkout@v6.0.2

    - name: build docker
      shell: bash
      run: |
        set -x
        docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} pull --include-deps
        docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} build

    - name: run docker
      shell: bash
      run: |
        set -x
        docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} up -d

    - name: run tests
      shell: bash
      run: |
        set -x
        ./tests.sh

    - name: cleanup
      if: always()
      shell: bash
      run: |
        set -x
        docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} logs webserver
        docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} down
